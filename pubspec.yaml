name: spark_mobile
description: AI-Powered Business Management Mobile App for WinTech Spark.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Design & UI
  google_fonts: ^6.2.1
  material_design_icons_flutter: ^7.0.7296
  
  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Storage & Backend
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.0
  path_provider: ^2.1.3

  # Features
  mobile_scanner: ^5.1.1
  pdf: ^3.10.8
  printing: ^5.11.1
  pos_universal_printer: ^0.2.10
  intl: ^0.19.0
  uuid: ^4.3.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logo.png
    - lib/assets/icon.png
    - lib/assets/AppLogo.jpeg
    - lib/assets/AppLogo-icon.png
